# Despliegue público: se combina con docker-compose.yml.
# Solo nginx (reverse-proxy) publica 80/443 (ADR 0031); web, gateway, API y canales solo quedan
# disponibles en las redes de Compose.
# Segmentación de red (escenario 3, ADR 0027): las bases de datos no publican puertos y la red
# `data` queda aislada (`internal: true`: sus contenedores no tienen salida a Internet).
# Excepciones documentadas: el UDP de stream-core (medios WebRTC) y coturn (red del host). MinIO ya
# no publica 9000: los vídeos salen por https://<host>/tint-media/* a través de nginx (escenario 1).
networks:
  data:
    internal: true

services:
  web:
    ports: !reset []
    build:
      args:
        # ADR 0024: el build de producción nunca apunta al Firebase Auth Emulator.
        VITE_FIREBASE_AUTH_EMULATOR_URL: ""

  identity-api:
    ports: !reset []
    environment:
      # ADR 0024: con production, identity-api se niega a arrancar si hay emulador.
      NODE_ENV: production
      FIREBASE_AUTH_EMULATOR_HOST: ""

  sync-core:
    ports: !reset []

  social-core:
    ports: !reset []

  analytics:
    ports: !reset []

  voice-core:
    ports: !reset []

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mongodb:
    ports: !reset []

  # Escenario 1 (ADR 0031): ni la API ni la consola de MinIO se publican; las URLs firmadas
  # apuntan a https://<host>/tint-media/* y nginx las pasa a MinIO por la red media.
  minio:
    ports: !reset []

  # Solo el puerto UDP de medios; la señalización WHIP/WHEP entra por el gateway.
  stream-core:
    ports: !override
      - "${STREAM_UDP_PORT:-8087}:${STREAM_UDP_PORT:-8087}/udp"

  # ADR 0024: el Firebase Auth Emulator (tokens sin firma) es solo de desarrollo. Con un
  # perfil que nadie activa, `up` no lo arranca y `config` no lo incluye.
  firebase-auth-emulator:
    profiles: ["never-in-production"]
    ports: !reset []
