# Cabeceras comunes hacia los upstreams (ADR 0031). Se incluye en CADA location con proxy_pass:
# en nginx, un proxy_set_header dentro de un location borra todos los heredados del server.
# nginx es el borde: X-Forwarded-For se sobrescribe con la IP real de la conexión, así un
# cliente no puede inyectar una IP falsa para saltarse los límites por IP.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Correlation-ID $correlation_id;
