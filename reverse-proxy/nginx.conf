# nginx del borde de TINT (ADR 0031). La configuración del sitio está en
# templates/default.conf.template (la imagen oficial la renderiza con envsubst al arrancar).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Escenario 2: no anunciar la versión del servidor.
    server_tokens off;

    # Logs JSON a stdout (ADR 0021), con el correlation_id que también ve Caddy.
    log_format json escape=json '{"time":"$time_iso8601","level":"info","service":"reverse-proxy",'
        '"msg":"request","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_ms":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","correlation_id":"$correlation_id",'
        '"client_ip":"$remote_addr"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Correlation ID: se respeta el del cliente si llega; si no, el request_id de nginx.
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # WebSocket: Connection: upgrade solo si el cliente lo pidió.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
